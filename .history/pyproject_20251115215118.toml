[project]
name = "my_project"
version = "0.1.0"
description = "Example project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
